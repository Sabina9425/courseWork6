{% extends 'base.html' %}

{% block content %}
<h1 class="mb-4">Разблокировать пользователя</h1>
<div class="alert alert-danger" role="alert">
    Вы уверены, что хотите разблокировать пользователя "{{ user.username }}"?
</div>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, разблокировать</button>
    <a href="{% url 'accounts' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
